<html lang="fr">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merci — Norland Production</title>

  <!-- (Optionnel) si tu veux garder les styles globaux -->
  <link rel="stylesheet" href="style.css">

  <style>
    /* ===== Base ===== */
    *{ box-sizing:border-box; margin:0; padding:0; font-family:'Poppins',sans-serif; }
    html,body{ height:100%; overflow-x:hidden; color:#fff; }
    a{ color:inherit; text-decoration:none; }

    /* ===== Background + overlay (même DA que tes pages) ===== */
    .background-container{
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
    }
    .background-image{
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      position: absolute;
      inset: 0;
      filter: brightness(0.55) contrast(1.08) saturate(1.12);
      transform: scale(1.03);
    }
    .gradient-overlay{
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,0.78), rgba(0,0,0,0.62));
    }

    /* ===== Layout center ===== */
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 24px;
    }

    /* ===== Card (dark blur like site) ===== */
    .card{
      width: min(720px, 92vw);
      background: rgba(0,0,0,0.30);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 18px;
      padding: 26px 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .card::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius: inherit;
      pointer-events:none;
      background: radial-gradient(900px 420px at 10% 0%,
        rgba(255,255,255,0.06),
        rgba(255,255,255,0.00) 55%);
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.10);
      opacity: .92;
      margin-bottom: 14px;
    }
    .badge-dot{
      width:10px; height:10px; border-radius:50%;
      background: linear-gradient(90deg, rgba(162,213,198,1), rgba(7,123,138,1), rgba(92,60,146,1));
      box-shadow: 0 0 18px rgba(162,213,198,.22);
      flex: 0 0 auto;
    }

    h1{
      font-size: clamp(2.0rem, 4vw, 2.8rem);
      line-height: 1.15;
      margin-bottom: 10px;
    }
    p{
      opacity: .78;
      line-height: 1.6;
      font-size: 1.05rem;
    }

    /* ===== CTA button (même glint premium) ===== */
    .cta{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;

      margin-top: 18px;
      background: #d72631;
      color:#fff;

      padding: 12px 18px;
      border-radius: 999px;
      font-weight: 700;

      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 18px 60px rgba(0,0,0,0.35);

      position: relative;
      overflow: hidden;

      transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease, filter .22s ease;
      will-change: transform, box-shadow;
    }

    .cta::before{
      content:"";
      position:absolute;
      inset:0;
      border-radius: inherit;
      pointer-events:none;
      opacity:0;
      transition: opacity .22s ease;

      background: linear-gradient(135deg,
        rgba(255,255,255,0.14),
        rgba(255,255,255,0.00) 35%,
        rgba(255,255,255,0.00) 65%,
        rgba(255,255,255,0.08)
      );
    }
    .cta:hover::before{ opacity:1; }
    .cta:hover{
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.20);
      box-shadow:
        0 22px 70px rgba(0,0,0,0.55),
        0 0 0 1px rgba(255,255,255,0.10),
        0 0 30px rgba(249,213,236,0.10);
    }

    /* Secondary link */
    .small-link{
      display:inline-block;
      margin-top: 14px;
      opacity: .68;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .small-link:hover{ opacity: .9; }

    @media (max-width: 768px){
      .cta:hover{ transform:none; }
      .card{ padding: 22px 18px; text-align:left; }
      .badge{ justify-content:flex-start; }
    }
  </style>
</head>

<body>
  <!-- Fond + overlay -->
  <div class="background-container">
    <div class="gradient-overlay"></div>
    <img src="01-1.jpg" class="background-image" alt="fond" />
  </div>

  <main class="card" role="main" aria-live="polite">
    <div class="badge">
      <span class="badge-dot"></span>
      <span>Demande envoyée</span>
    </div>

    <h1>Merci pour ta confiance.</h1>
    <p>Je te reviens sous <strong>24–48h</strong> (hors week-end) avec les prochaines étapes.</p>

    <a class="cta" href="index.html">← Retour au site</a>

    <!-- Optionnel : petit lien vers portfolio si tu veux le garder -->
    <!-- <a class="small-link" href="portfolio.html">Voir le portfolio</a> -->
  </main>
</body>
</html>
